[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-ai-router"
version = "0.1.0"
description = "A Cloudflare-planned Gemini multimodal model router with CLI and HTTP API"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.8", "python-dotenv>=1.0", "typer>=0.12", "tzdata>=2024.1"]

[project.scripts]
smart-ai = "smart_ai.cli:app"

[tool.setuptools.package-data]
smart_ai = ["prompts/*.md"]
